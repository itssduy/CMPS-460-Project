{% extends "base.html" %}

{% block content %}
  <h1 class="mb-1">Catalog</h1>
  <p class="text-muted">Browse games, build your library, and find something new to play.</p>

  <form id="filters" class="row g-2 mb-3">
    <div class="col-12 col-lg-4">
      <input type="search" name="q" class="form-control" placeholder="Search games" aria-label="Search games">
    </div>
    <div class="col-6 col-lg-2">
      <select name="tag" class="form-select" aria-label="Tag">
        <option value="">All tags</option>
      </select>
    </div>
    <div class="col-6 col-lg-2">
      <select name="platform" class="form-select" aria-label="Platform">
        <option value="">All platforms</option>
      </select>
    </div>
    <div class="col-6 col-lg-2">
      <select name="publisher" class="form-select" aria-label="Publisher">
        <option value="">All publishers</option>
      </select>
    </div>
    <div class="col-6 col-lg-2">
      <select name="sort" class="form-select" aria-label="Sort by">
        <option value="title">Title A–Z</option>
        <option value="price">Price: low to high</option>
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="popular">Most popular</option>
      </select>
    </div>
  </form>

  <div id="alert"></div>
  <p id="result-count" class="text-muted small"></p>
  <div id="games" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3"></div>
{% endblock %}

{% block scripts %}
<script>
  const filters = document.getElementById("filters");
  const grid = document.getElementById("games");
  const resultCount = document.getElementById("result-count");
  const alertBox = document.getElementById("alert");

  function fillSelect(name, values) {
    const select = filters.elements[name];
    select.insertAdjacentHTML("beforeend", values
      .map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`)
      .join(""));
  }

  function currentParams() {
    const params = new URLSearchParams();
    for (const name of ["q", "tag", "platform", "publisher", "sort"]) {
      const value = filters.elements[name].value.trim();
      if (value && !(name === "sort" && value === "title")) {
        params.set(name, value);
      }
    }
    return params;
  }

  function renderGames(games) {
    resultCount.textContent = `${games.length} game${games.length === 1 ? "" : "s"}`;

    if (games.length === 0) {
      grid.innerHTML = currentParams().toString()
        ? '<p class="text-muted">No games match those filters.</p>'
        : '<p class="text-muted">No games yet. <a href="/users/new">Register</a> and sign in through Steam on your profile to import your library, or <a href="/games/new">add a game</a>.</p>';
      return;
    }

    grid.innerHTML = games.map((game) => `
      <div class="col">
        <div class="card h-100 game-card overflow-hidden">
          ${gameImage(game, "card-img-top game-cover")}
          <div class="card-body d-flex flex-column">
            <h2 class="h6 card-title mb-1">
              <a href="/games/${game.game_id}" class="stretched-link text-reset text-decoration-none">${escapeHtml(game.title)}</a>
            </h2>
            <p class="text-muted small mb-2">${escapeHtml(game.publisher)}</p>
            <div class="mb-2">${platformBadges(game.platforms)}</div>
            <div class="d-flex justify-content-between align-items-center mt-auto pt-2">
              <span class="fw-semibold">${formatPrice(game.price)}</span>
              <span class="text-muted small">In ${game.popularity} librar${game.popularity === 1 ? "y" : "ies"}</span>
            </div>
          </div>
        </div>
      </div>`).join("");
  }

  async function loadGames() {
    const params = currentParams();
    const query = params.toString();
    history.replaceState(null, "", query ? `/?${query}` : "/");

    try {
      renderGames(await api("GET", `/api/catalog${query ? `?${query}` : ""}`));
      alertBox.innerHTML = "";
    } catch (error) {
      showAlert(alertBox, error.message);
    }
  }

  async function init() {
    const [tags, platforms, allGames] = await Promise.all([
      api("GET", "/api/tags"),
      api("GET", "/api/platforms"),
      api("GET", "/api/catalog"),
    ]);

    fillSelect("tag", tags.map((tag) => tag.name).sort());
    fillSelect("platform", platforms.map((platform) => platform.name));
    fillSelect("publisher", [...new Set(allGames.map((game) => game.publisher))].sort());

    const urlParams = new URLSearchParams(window.location.search);
    for (const name of ["q", "tag", "platform", "publisher", "sort"]) {
      if (urlParams.has(name)) {
        filters.elements[name].value = urlParams.get(name);
      }
    }

    await loadGames();
  }

  let searchTimer;
  filters.addEventListener("input", (event) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadGames, event.target.name === "q" ? 250 : 0);
  });
  filters.addEventListener("submit", (event) => event.preventDefault());

  init().catch((error) => showAlert(alertBox, error.message));
</script>
{% endblock %}
