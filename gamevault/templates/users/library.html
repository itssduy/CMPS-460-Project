{% extends "base.html" %}

{% block title %}Library · GameVault{% endblock %}

{% block content %}
  <div id="alert"></div>

  <div id="library-page" class="d-none">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <h1 id="library-title" class="mb-0"></h1>
      <a id="profile-link" class="btn btn-outline-secondary" href="/users/{{ user_id }}">Profile</a>
    </div>

    <div class="table-responsive mb-5">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Title</th>
            <th>Publisher</th>
            <th>Platforms</th>
            <th>Price</th>
            <th>Added</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="library"></tbody>
      </table>
    </div>

    <h2 class="h4">Recommended for you</h2>
    <p class="text-muted">Games that share tags with ones in this library.</p>
    <div id="recommendations" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3"></div>
  </div>
{% endblock %}

{% block scripts %}
<script>
  const userId = {{ user_id }};
  const alertBox = document.getElementById("alert");
  const libraryRows = document.getElementById("library");
  const recommendationCards = document.getElementById("recommendations");

  function renderLibrary(games) {
    if (games.length === 0) {
      libraryRows.innerHTML = '<tr><td colspan="6" class="text-muted">No games in this library yet.</td></tr>';
      return;
    }

    libraryRows.innerHTML = games.map((game) => `
      <tr>
        <td>
          <a href="/games/${game.game_id}" class="d-flex align-items-center gap-3 text-reset text-decoration-none">
            ${gameImage(game, "game-thumb")}
            <span>${escapeHtml(game.title)}</span>
          </a>
        </td>
        <td>${escapeHtml(game.publisher)}</td>
        <td>${platformBadges(game.platforms)}</td>
        <td>${formatPrice(game.price)}</td>
        <td>${formatDate(game.added_at)}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-danger" data-remove="${game.game_id}">Remove</button>
        </td>
      </tr>`).join("");
  }

  function renderRecommendations(games) {
    if (games.length === 0) {
      recommendationCards.innerHTML = '<p class="text-muted">No recommendations yet. They come from games in the catalog that this user doesn\'t own, so they show up as more people import their libraries.</p>';
      return;
    }

    recommendationCards.innerHTML = games.map((game) => `
      <div class="col">
        <div class="card h-100 game-card overflow-hidden">
          <a href="/games/${game.game_id}">${gameImage(game, "card-img-top game-cover")}</a>
          <div class="card-body d-flex flex-column">
            <h3 class="h6 card-title mb-1"><a href="/games/${game.game_id}" class="text-reset text-decoration-none">${escapeHtml(game.title)}</a></h3>
            <p class="text-muted small mb-2">${escapeHtml(game.publisher)} · ${formatPrice(game.price)}</p>
            <div class="mb-2">${platformBadges(game.platforms)}</div>
            <div class="mb-3">
              ${game.shared_tags.map((tag) => `<span class="badge text-bg-secondary me-1">${escapeHtml(tag)}</span>`).join("")}
            </div>
            <button class="btn btn-sm btn-primary mt-auto" data-add="${game.game_id}">Add to library</button>
          </div>
        </div>
      </div>`).join("");
  }

  async function load() {
    const [library, recommendations] = await Promise.all([
      api("GET", `/api/users/${userId}/library`),
      api("GET", `/api/users/${userId}/recommendations?limit=6`),
    ]);
    renderLibrary(library);
    renderRecommendations(recommendations);
  }

  const steamParams = new URLSearchParams(window.location.search);
  if (steamParams.has("steam_added_to_library")) {
    const summary = {};
    for (const [key, value] of steamParams) {
      summary[key.replace("steam_", "")] = Number(value);
    }
    showAlert(alertBox, steamSummary(summary), "success");
    history.replaceState(null, "", window.location.pathname);
  }

  api("GET", `/api/users/${userId}`)
    .then((user) => {
      document.title = `${user.username}'s Library · GameVault`;
      document.getElementById("library-title").textContent = `${user.username}'s Library`;
      document.getElementById("library-page").classList.remove("d-none");
      return load();
    })
    .catch((error) => showAlert(alertBox, error.message));

  document.addEventListener("click", async (event) => {
    const removeId = event.target.dataset.remove;
    const addId = event.target.dataset.add;
    if (!removeId && !addId) {
      return;
    }

    event.target.disabled = true;
    try {
      if (removeId) {
        await api("DELETE", `/api/users/${userId}/library/${removeId}`);
      } else {
        await api("POST", `/api/users/${userId}/library`, { game_id: Number(addId) });
      }
      await load();
    } catch (error) {
      showAlert(alertBox, error.message);
      event.target.disabled = false;
    }
  });
</script>
{% endblock %}
