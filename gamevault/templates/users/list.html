{% extends "base.html" %}

{% block title %}Users · GameVault{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="mb-0">Users</h1>
    <a class="btn btn-primary" href="/users/new">Register</a>
  </div>

  <div id="alert"></div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Joined</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="users">
        <tr><td colspan="4" class="text-muted">Loading...</td></tr>
      </tbody>
    </table>
  </div>
{% endblock %}

{% block scripts %}
<script>
  const rows = document.getElementById("users");

  api("GET", "/api/users")
    .then((users) => {
      if (users.length === 0) {
        rows.innerHTML = '<tr><td colspan="4" class="text-muted">No users yet.</td></tr>';
        return;
      }

      rows.innerHTML = users.map((user) => `
        <tr>
          <td><a href="/users/${user.user_id}">${escapeHtml(user.username)}</a></td>
          <td>${escapeHtml(user.email)}</td>
          <td>${formatDate(user.created_at)}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" href="/users/${user.user_id}/library">Library</a>
          </td>
        </tr>`).join("");
    })
    .catch((error) => {
      rows.innerHTML = "";
      showAlert(document.getElementById("alert"), error.message);
    });
</script>
{% endblock %}
